<div class="home-container">
  <div class="navbar">
    <h1>🔒 Fingerprint Auth</h1>
    <div class="nav-links">
      <a routerLink="/profile">Profile</a>
      <button (click)="logout()">Logout</button>
    </div>
  </div>
  <div class="content">
    <p class="welcome-text">Welcome to the Dashboard!</p>
    <div class="button-group">
      <button class="btn btn-primary" (click)="getData()">Get Data</button>
      <button class="btn btn-secondary" (click)="postData()">Post Data</button>
      <button class="btn btn-secure" (click)="secure()">Secure Endpoint</button>
    </div>
    <div class="message-box">
      <p>{{ message || 'Click a button to fetch data...' }}</p>
    </div>
  </div>
</div>
