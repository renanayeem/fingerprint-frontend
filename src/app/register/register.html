<div class="register-container">
  <div class="register-box">
    <h2>Create Account</h2>
    <input type="text" placeholder="Username" [(ngModel)]="username" />
    <input type="password" placeholder="Password" [(ngModel)]="password" />
    <input type="text" placeholder="Full Name" [(ngModel)]="name" />
    <input type="email" placeholder="Email" [(ngModel)]="email" />
    <input type="text" placeholder="Phone" [(ngModel)]="phone" />
    <input type="text" placeholder="Address" [(ngModel)]="address" />
    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>
    <button (click)="register()">Register</button>
    <p>Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</div>
